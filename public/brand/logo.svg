<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="70%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Neon Crimson Gradient -->
    <linearGradient id="crimsonLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Dark Carbon Inset Gradient -->
    <linearGradient id="carbonPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>

    <!-- Crimson Outer Glow Filter -->
    <filter id="crimsonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ef4444" flood-opacity="0.38" />
    </filter>

    <!-- Metallic Rim Specular -->
    <linearGradient id="specularRim" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#27272a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Base (iOS & Android HIG Compliant) -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="108"
    fill="url(#bgGlow)"
    stroke="url(#specularRim)"
    stroke-width="3.5"
  />

  <!-- Subtle Precision Calibration Grid Circles (Biomechanics Motif) -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="256" cy="256" r="144" fill="none" stroke="#3f3f46" stroke-width="2" stroke-opacity="0.4" />

  <!-- Outer Barbell Weight Plate Chamfer -->
  <circle
    cx="256"
    cy="256"
    r="164"
    fill="url(#carbonPlate)"
    stroke="#27272a"
    stroke-width="3"
    filter="url(#crimsonShadow)"
  />

  <!-- High-Energy Precision Geometric Glyph: Dynamic Monogram "G" & "S" + Science Helix Vector -->
  <g id="brandMark" transform="translate(0, 0)">
    <!-- Primary Sweeping Power Arc (Outer C of "G" & Plate Rim) -->
    <path
      d="M 334 176 
         C 312 148, 285 134, 256 134
         C 188.6 134, 134 188.6, 134 256
         C 134 323.4, 188.6, 378, 256 378
         C 310 378, 356 342, 372 292
         L 316 292
         C 304 318, 282 334, 256 334
         C 212.9 334, 178 299.1, 178 256
         C 178 212.9, 212.9, 178, 256 178
         C 275 178, 292 186, 304 198
         Z"
      fill="url(#crimsonLaser)"
    />

    <!-- Forward Dynamic Kinetic Strike (The Science / Velocity Slash across center) -->
    <polygon
      points="232,232 384,232 344,280 192,280"
      fill="url(#crimsonLaser)"
      opacity="0.95"
    />

    <!-- High-Precision Core Nexus (Diamond Center Accent) -->
    <rect
      x="241"
      y="241"
      width="30"
      height="30"
      transform="rotate(45 256 256)"
      fill="#ffffff"
      opacity="0.9"
    />
  </g>
</svg>
